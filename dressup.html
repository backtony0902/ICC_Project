<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DR5E2L2XRV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DR5E2L2XRV');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSION 03: 해경 제복 착용 시스템 | KCG RESTORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060b18; --border: rgba(70,130,220,0.35);
      --cyan: #4dd9ff; --red: #ff3333; --yellow: #f0a500; --green: #00ff88;
      --muted: rgba(160,196,255,0.65);
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #040814;
      color: white; min-height: 100vh;
      display: flex; flex-direction: column; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        linear-gradient(rgba(30,80,200,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,80,200,0.08) 1px, transparent 1px);
      background-size: 36px 36px; pointer-events: none; z-index: 1;
    }

    nav {
      height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      background: rgba(3,7,18,0.95); border-bottom: 1px solid var(--border); position: relative; z-index: 100;
    }
    .nav-title { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--cyan); }
    .back-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white;
      padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.2s;
    }
    .back-btn:hover { background: rgba(77,217,255,0.2); border-color: var(--cyan); }

    main {
      flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 24px 20px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px; position: relative; z-index: 10;
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
    }

    /* 홀로그램 캐릭터 프레임 */
    .preview-card {
      background: rgba(6,14,36,0.85); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; min-height: 540px; backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(77,217,255,0.05);
    }
    .card-badge {
      position: absolute; top: 16px; left: 16px; font-family: 'Press Start 2P', monospace;
      font-size: 8px; color: var(--cyan); border: 1px solid var(--cyan); padding: 4px 8px; border-radius: 4px;
    }
    .char-container {
      width: 100%; max-width: 340px; height: 460px; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .char-img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(77,217,255,0.3));
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .char-img.changing { opacity: 0; transform: scale(0.95); }

    /* 컨트롤 패널 */
    .control-panel { display: flex; flex-direction: column; gap: 16px; }

    .panel-box {
      background: rgba(6,14,36,0.85); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    }
    .panel-title { font-size: 14px; font-weight: 700; color: var(--cyan); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

    /* 대원 선택 */
    .gender-select { display: flex; gap: 10px; }
    .gender-btn {
      flex: 1; padding: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 8px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .gender-btn.active { background: rgba(77,217,255,0.15); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(77,217,255,0.2); }

    /* 제복 선택 버튼 Grid (6개) */
    .uniform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .uniform-btn {
      padding: 10px 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 8px; color: white; text-align: left; cursor: pointer; transition: 0.2s;
    }
    .uniform-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(77,217,255,0.5); }
    .uniform-btn.active {
      background: rgba(0,255,136,0.12); border-color: var(--green); color: var(--green);
      box-shadow: 0 0 10px rgba(0,255,136,0.2);
    }
    .u-name { font-size: 12.5px; font-weight: 700; display: block; margin-bottom: 2px; }
    .u-desc { font-size: 10px; color: var(--muted); }

    /* 실시간 가이드 */
    .info-box { font-size: 12px; color: rgba(200,220,255,0.85); line-height: 1.5; }
    .info-tag { display: inline-block; background: rgba(240,165,0,0.2); color: var(--yellow); border: 1px solid var(--yellow); padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-bottom: 4px; }

    /* 제출 버튼 */
    .submit-btn {
      width: 100%; padding: 15px; background: var(--yellow); color: #1a0800; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 900; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 20px rgba(240,165,0,0.3); margin-top: auto;
    }
    .submit-btn:hover { background: #ffb800; transform: translateY(-2px); }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(2,6,18,0.88); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
    }
    .modal-box {
      background: #081228; border: 2px solid var(--green); border-radius: 14px;
      padding: 28px; max-width: 460px; width: 100%; text-align: center;
      box-shadow: 0 0 40px rgba(0,255,136,0.25);
    }
    .modal-badge { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--green); margin-bottom: 8px; display: block; }
    .modal-title { font-size: 22px; font-weight: 900; color: white; margin-bottom: 16px; }
    
    .modal-card {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 20px; text-align: left;
    }
    .modal-u-name { font-size: 16px; font-weight: 700; color: var(--cyan); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .modal-u-tag { font-size: 10px; padding: 2px 8px; background: rgba(77,217,255,0.15); border: 1px solid var(--cyan); border-radius: 4px; color: var(--cyan); }
    .modal-u-desc { font-size: 13px; color: rgba(220,235,255,0.9); line-height: 1.65; }

    .modal-btn {
      width: 100%; padding: 14px; background: var(--green); color: #021a0e; font-weight: 900;
      border: none; border-radius: 8px; cursor: pointer; font-size: 15px; transition: 0.2s;
    }
    .modal-btn:hover { background: #33ff99; }
  </style>
</head>
<body>

<nav>
  <div class="nav-title">MISSION 03 : UNIFORM RESTORE</div>
  <button class="back-btn" onclick="location.href='index.html'">← 메인으로</button>
</nav>

<main>
  <!-- 미리보기 카드 -->
  <div class="preview-card">
    <div class="card-badge">LIVE PREVIEW</div>
    <div class="char-container">
      <img id="char-img" class="char-img" src="images/char_female_basic.png" alt="대원 캐릭터" onerror="handleImgError()">
    </div>
  </div>

  <!-- 컨트롤 패널 -->
  <div class="control-panel">
    <!-- 대원 선택 -->
    <div class="panel-box">
      <div class="panel-title">👤 대원 선택</div>
      <div class="gender-select">
        <button class="gender-btn active" id="g-female" onclick="selectGender('female')">
          <span>👩</span> 해누리 대원 (여)
        </button>
        <button class="gender-btn" id="g-male" onclick="selectGender('male')">
          <span>👨</span> 해우리 대원 (남)
        </button>
      </div>
    </div>

    <!-- 제복 선택 (6가지 복장) -->
    <div class="panel-box">
      <div class="panel-title">🥋 제복 선택 (UNIFORM)</div>
      <div class="uniform-grid">
        <button class="uniform-btn active" id="u-basic" onclick="selectUniform('basic')">
          <span class="u-name">기본 상태</span>
          <span class="u-desc">제복 미착용 (대기 상태)</span>
        </button>
        <button class="uniform-btn" id="u-duty" onclick="selectUniform('duty')">
          <span class="u-name">근무복</span>
          <span class="u-desc">연안 순찰 및 일반 치안</span>
        </button>
        <button class="uniform-btn" id="u-formal" onclick="selectUniform('formal')">
          <span class="u-name">정복 (Formal)</span>
          <span class="u-desc">의전 및 공식 행사</span>
        </button>
        <button class="uniform-btn" id="u-rescue" onclick="selectUniform('rescue')">
          <span class="u-name">해양구조대복</span>
          <span class="u-desc">인명 구조 및 특수 수색</span>
        </button>
        <button class="uniform-btn" id="u-ssat" onclick="selectUniform('ssat')">
          <span class="u-name">특공대복 (SSAT)</span>
          <span class="u-desc">대테러 및 특수 작전</span>
        </button>
        <button class="uniform-btn" id="u-flight" onclick="selectUniform('flight')">
          <span class="u-name">항공대 조종복</span>
          <span class="u-desc">항공 수색 및 긴급 이송</span>
        </button>
      </div>
    </div>

    <!-- 제복 설명 정보 -->
    <div class="panel-box">
      <div class="panel-title">📋 현재 복장 임무 가이드</div>
      <div class="info-box">
        <span class="info-tag" id="info-tag">대기 상태</span>
        <div id="info-text">현재 제복을 착용하지 않은 상태입니다. 상황에 알맞은 제복을 선택해 주세요.</div>
      </div>
    </div>

    <!-- 제출 버튼 -->
    <button class="submit-btn" onclick="completeMission()">✔ 제복 착용 완료 & 복원 제출</button>
  </div>
</main>

<!-- 성공 및 제복 설명 모달 -->
<div class="modal-overlay" id="success-modal">
  <div class="modal-box">
    <span class="modal-badge">MISSION COMPLETE</span>
    <div class="modal-title" id="modal-title">준비 완료!</div>
    
    <div class="modal-card">
      <div class="modal-u-name">
        <span id="modal-u-title">근무복</span>
        <span class="modal-u-tag" id="modal-u-tag">임무 완료</span>
      </div>
      <div class="modal-u-desc" id="modal-u-desc">
        제복 설명이 들어가는 공간입니다.
      </div>
    </div>

    <button class="modal-btn" onclick="location.href='index.html'">메인 화면으로 돌아가기</button>
  </div>
</div>

<script>
  let currentGender = 'female';
  let currentUniform = 'basic'; // 기본 상태 (제복 안 입은 상태)

  const uniformData = {
    basic: {
      name: '기본 상태 (제복 미착용)',
      tag: '대기 상태',
      desc: '대원이 제복을 입지 않은 기본 복장 상태입니다. 출동 및 임무에 알맞은 제복을 선택해 착용시켜 주세요.'
    },
    duty: {
      name: '해양경찰 근무복',
      tag: '해상 순찰 및 치안',
      desc: '해양경찰의 가장 기본적인 제복으로, 연안 순찰, 해상 치안 유지, 선박 안전 점검 등 일상적인 해양 경비 임무 수행 시 착용합니다.'
    },
    formal: {
      name: '해양경찰 정복',
      tag: '공식 행사 및 의전',
      desc: '해양경찰로서의 위엄과 신뢰를 상징하는 단정한 정복입니다. 국가 주요 행사, 명예로운 서훈식 및 공식 접견 시 착용합니다.'
    },
    rescue: {
      name: '해양구조대 특수복',
      tag: '인명 구조 및 특수 수색',
      desc: '전문 잠수 장비와 특수 구조복으로 구성되어 있어, 거친 파도와 위험 해역에서도 신속하게 바다에 투입되어 인명을 구조할 수 있습니다.'
    },
    ssat: {
      name: '해양경찰 특공대복 (SSAT)',
      tag: '대테러 및 특수 작전',
      desc: '해양 대테러, 선박 강제 진입 및 강력 범죄 단속 등 고도의 위험 작전 수행 시 대원의 신체를 보호하고 작전 수행력을 극대화하는 특수 전투복입니다.'
    },
    flight: {
      name: '항공대 조종복',
      tag: '항공 수색 및 긴급 이송',
      desc: '해양경찰 항공대(헬기 및 고정경비기) 대원이 해상 광역 수색, 신속 응급 환자 이송 및 입체적 해상 감시 임무 수행 시 착용하는 전용 항공복입니다.'
    }
  };

  function updatePreview() {
    const imgEl = document.getElementById('char-img');
    
    imgEl.classList.add('changing');
    
    setTimeout(() => {
      const imgPath = `images/char_${currentGender}_${currentUniform}.png`;
      imgEl.src = imgPath;
      imgEl.classList.remove('changing');
    }, 120);

    // 가이드 정보 업데이트
    const info = uniformData[currentUniform];
    document.getElementById('info-tag').textContent = info.tag;
    document.getElementById('info-text').textContent = info.desc;
  }

  // 이미지 예외 처리 (Fallback)
  function handleImgError() {
    const imgEl = document.getElementById('char-img');
    if (currentGender === 'female') {
      imgEl.src = 'char_female_basic.png';
    } else {
      imgEl.src = 'char_male_basic.png';
    }
  }

  function selectGender(gender) {
    currentGender = gender;
    document.getElementById('g-female').classList.toggle('active', gender === 'female');
    document.getElementById('g-male').classList.toggle('active', gender === 'male');
    updatePreview();
  }

  function selectUniform(uniform) {
    currentUniform = uniform;
    ['basic', 'duty', 'formal', 'rescue', 'ssat', 'flight'].forEach(u => {
      const btn = document.getElementById(`u-${u}`);
      if (btn) btn.classList.toggle('active', u === uniform);
    });
    updatePreview();
  }

  function completeMission() {
    // 미션 완료 상태 저장
    localStorage.setItem('icc_dressup_done', 'true');
    
    const info = uniformData[currentUniform];
    const genderName = currentGender === 'female' ? '해누리 대원' : '해우리 대원';
    
    // 모달 데이터 채우기
    document.getElementById('modal-title').textContent = `${genderName} 준비 완료!`;
    document.getElementById('modal-u-title').textContent = info.name;
    document.getElementById('modal-u-tag').textContent = info.tag;
    document.getElementById('modal-u-desc').textContent = info.desc;
    
    // 모달 띄우기
    document.getElementById('success-modal').style.display = 'flex';
  }

  // 초기 실행
  updatePreview();
</script>
</body>
</html>
